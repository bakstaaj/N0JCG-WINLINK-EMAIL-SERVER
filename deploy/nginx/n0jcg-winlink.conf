server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/n0jcg-winlink;
    index index.html;

    location = / {
        return 302 /webmail/;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location /ui/ {
        # The snippet is created by setup_operator_auth.sh. The default
        # deployment remains accessible until an operator password is set.
        include /etc/nginx/snippets/n0jcg-winlink-auth.conf.optional;
        try_files $uri $uri/ /ui/index.html;
    }

    location /api/v1/ {
        proxy_pass http://127.0.0.1:8097;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /api/v1/operator/templates/update {
        include /etc/nginx/snippets/n0jcg-winlink-auth.conf.optional;
        proxy_pass http://127.0.0.1:8097;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /api/v1/operator/radio-profile {
        include /etc/nginx/snippets/n0jcg-winlink-auth.conf.optional;
        proxy_pass http://127.0.0.1:8097;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location ~ /\. {
        deny all;
    }
}
